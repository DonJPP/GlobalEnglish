<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de Aula</title>
    <link rel="stylesheet" href="../../Estilos/admin.css">
</head>

<body>

    <header>
        <h3>Registro de Aula</h3>
    </header>

    <main>
        <p>
            <label for="numeroAula">ID Aula</label>
            <input type="number" id="numeroAula">

            <label for="grado">Grado</label>
            <select id="grado">
                <option value="">Seleccione un grado</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>


            <label for="idSede">ID Sede</label>
            <input type="number" id="idSede">
        </p>

        <button id="btnGuardarAula" class="btn">Guardar Aula</button>
    </main>

    <script src="../../js/conexion.js"></script>
    <script>
        document.getElementById("btnGuardarAula")
        .addEventListener("click", async function () {

            const id_aula = document.getElementById("numeroAula").value.trim();
            const grado = document.getElementById("grado").value.trim();
            const id_sede = document.getElementById("idSede").value.trim();

            if (!id_aula || !grado || !id_sede) {
                alert("Por favor complete todos los campos.");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/aulas`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        id_aula,
                        grado,
                        id_sede
                        // ⚠️ IMPORTANTE:
                        // No enviar "programa", pues el backend lo calcula automáticamente.
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(
                        "Aula registrada correctamente.\n\n" +
                        "ID Aula: " + data.id_aula + "\n" +
                        "Grado: " + data.grado + "\n" +
                        "Programa asignado: " + data.programa + "\n" +
                        "ID Sede: " + data.id_sede
                    );

                    document.getElementById("numeroAula").value = "";
                    document.getElementById("grado").value = "";
                    document.getElementById("idSede").value = "";
                } else {
                    alert("Error: " + (data.error || data.message || "No se pudo registrar el aula"));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error de conexión con el servidor");
            }
        });
    </script>

</body>

</html>
