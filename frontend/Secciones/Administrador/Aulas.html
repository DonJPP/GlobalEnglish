<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Aula</title>
    <link rel="stylesheet" href="../../Estilos/admin.css">
</head>
<body>

    <header><h3>Registro de Aula</h3></header>

    <main>
        <p>
            <label for="numeroAula">N° Aula</label>
            <input type="number" id="numeroAula">

            <label for="grado">Grado</label>
            <input type="text" id="grado">

            <label for="programa">Programa</label>
            <input type="text" id="programa">

            <label for="idSede">ID Sede</label>
            <input type="number" id="idSede">
        </p>

        <button id="btnGuardarAula" class="btn">Guardar Aula</button>
    </main>

    <script>
        document.getElementById("btnGuardarAula").addEventListener("click", function () {

            const numeroAula = document.getElementById("numeroAula").value.trim();
            const grado = document.getElementById("grado").value.trim();
            const programa = document.getElementById("programa").value.trim();
            const idSede = document.getElementById("idSede").value.trim();

            if (!numeroAula || !grado || !programa || !idSede) {
                alert("Por favor complete todos los campos.");
                return;
            }

            // cuando se conecte con la base de datos aqui va el codigo para guardar la info en la base de datos
            alert("Aula registrada correctamente.\n\n" +
                  "N° Aula: " + numeroAula + "\n" +
                  "Grado: " + grado + "\n" +
                  "Programa: " + programa + "\n" +
                  "ID Sede: " + idSede);
        });
    </script>

</body>
</html>
