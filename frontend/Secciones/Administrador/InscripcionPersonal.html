<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de Aula</title>
    <link rel="stylesheet" href="../../Estilos/admin.css">
</head>

<body>

    <header>
        <h3>Inscribir Tutor</h3>
    </header>

    <main>
        <p>
            <label for="ID_Tutor">ID_Tutor</label>
            <input type="number" id="ID_Tutor">

            <label for="Nombres">Nombres</label>
            <input type="text" id="Nombres">

            <label for="Apellidos">Apellidos</label>
            <input type="text" id="Apellidos">

            <label for="Usuario">Usuario</label>
            <input type="text" id="Usuario">

            <label for="Contraseña">Contraseña</label>
            <input type="text" id="Contraseña">
        </p>

        <button id="btnInscribirTutor" class="btn">Inscribir Tutor</button>
    </main>





    <script src="../../js/conexion.js"></script>
    <script>
        document.getElementById("btnInscribirTutor").addEventListener("click", async function () {

            const id_tutor = document.getElementById("ID_Tutor").value.trim();
            const nombres = document.getElementById("Nombres").value.trim();
            const apellidos = document.getElementById("Apellidos").value.trim();
            const usuario = document.getElementById("Usuario").value.trim();
            const password_hash = document.getElementById("Contraseña").value.trim();

            if (!id_tutor || !nombres || !apellidos || !usuario || !password_hash) {
                alert("Por favor complete todos los campos.");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/tutores`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id_tutor,
                        nombres,
                        apellidos,
                        usuario,
                        password_hash
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Tutor Ingresado Correctamente.");
                    // Clear fields
                    document.getElementById("ID_Tutor").value = "";
                    document.getElementById("Nombres").value = "";
                    document.getElementById("Apellidos").value = "";
                    document.getElementById("Usuario").value = "";
                    document.getElementById("Contraseña").value = "";
                } else {
                    alert("Error: " + (data.error || data.message || "No se pudo crear el tutor"));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error de conexión con el servidor");
            }
        });
    </script>

</body>

</html>
