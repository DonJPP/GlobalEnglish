<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Horarios</title>
    <link rel="stylesheet" href="../../Estilos/admin.css">
</head>

<body>

<header><h3>Registro de Horarios</h3></header>

<main>
    <p>
        <label for="N_Aula">N Aula</label>
        <!-- AHORA ES UN SELECT, SE LLENA DINÁMICAMENTE -->
        <select id="N_Aula">
            <option value="">Seleccione un aula</option>
            <!-- Opciones reales se agregan con JS -->
        </select>

        <label for="Hora_Inicio">Hora Inicio</label>
        <!-- type="time" devuelve HH:MM -->
        <input type="time" id="Hora_Inicio">

        <label for="Hora_Fin">Hora Fin</label>
        <input type="time" id="Hora_Fin">

        <label for="Minutos">Minutos</label>
        <select id="Minutos">
            <option value="">Seleccione minutos</option>
            <option value="40">40</option>
            <option value="45">45</option>
            <option value="50">50</option>
            <option value="55">55</option>
            <option value="60">60</option>
        </select>

        <label for="Dia_Semana">Día Semana</label>
        <select id="Dia_Semana">
            <option value="">Seleccione un día</option>
            <option value="LUNES">LUNES</option>
            <option value="MARTES">MARTES</option>
            <option value="MIERCOLES">MIERCOLES</option>
            <option value="JUEVES">JUEVES</option>
            <option value="VIERNES">VIERNES</option>
            <option value="SABADO">SABADO</option>
        </select>

    </p>

    <button id="btnCrearHorario" class="btn">Crear Horario</button>
</main>

<script src="../../js/conexion.js"></script>

<script>
function normalizarHora(horaStr) {
    const raw = horaStr.trim();
    // Acepta H:MM, HH:MM, H:M, HH:M y lo convierte a HH:MM
    const partes = raw.split(":");
    if (partes.length !== 2) return raw; // se valida en backend

    let [h, m] = partes;
    h = h.padStart(2, "0");
    m = m.padStart(2, "0");
    return `${h}:${m}`;
}

// 🔹 NUEVO: cargar aulas reales en el select
async function cargarAulas() {
    const selectAula = document.getElementById("N_Aula");

    try {
        const response = await fetch(`${API_URL}/aulas`);
        if (!response.ok) {
            throw new Error("No se pudieron obtener las aulas");
        }

        const aulas = await response.json();

        // Dejar opción por defecto
        selectAula.innerHTML = '<option value="">Seleccione un aula</option>';

        aulas.forEach((aula) => {
            const option = document.createElement("option");
            option.value = aula.id_aula;
            option.textContent = `Aula ${aula.id_aula} - Grado ${aula.grado} - ${aula.programa}`;
            selectAula.appendChild(option);
        });

    } catch (error) {
        console.error("Error al cargar aulas:", error);
        alert("No se pudieron cargar las aulas. Verifique la conexión o el backend.");
    }
}

// Ejecutar al cargar la página
window.addEventListener("DOMContentLoaded", cargarAulas);

document.getElementById("btnCrearHorario").addEventListener("click", async function () {
    const id_aula = document.getElementById("N_Aula").value.trim();
    let hora_inicio = document.getElementById("Hora_Inicio").value.trim();
    let hora_fin = document.getElementById("Hora_Fin").value.trim();
    const minutos_clase = document.getElementById("Minutos").value.trim();
    let dia_semana_input = document.getElementById("Dia_Semana").value.trim();

    if (!id_aula || !hora_inicio || !hora_fin || !minutos_clase || !dia_semana_input) {
        alert("Por favor complete todos los campos.");
        return;
    }

    // Normalizar a HH:MM
    hora_inicio = normalizarHora(hora_inicio);
    hora_fin = normalizarHora(hora_fin);

    const minutos_equivalentes = Number(minutos_clase);
    const MINUTOS_VALIDOS = [40, 45, 50, 55, 60];

    if (isNaN(minutos_equivalentes) || !MINUTOS_VALIDOS.includes(minutos_equivalentes)) {
        alert("Los minutos deben ser uno de: " + MINUTOS_VALIDOS.join(", "));
        return;
    }

    // Mapear día de la semana (aunque ya viene en mayúscula del select, esto no estorba)
    let dia_semana;
    const numDia = Number(dia_semana_input);
    if (!isNaN(numDia)) {
        const mapaDias = {
            1: "LUNES",
            2: "MARTES",
            3: "MIERCOLES",
            4: "JUEVES",
            5: "VIERNES",
            6: "SABADO"
        };
        dia_semana = mapaDias[numDia];
        if (!dia_semana) {
            alert("Día de semana inválido. Use 1 a 6 (Lunes a Sábado).");
            return;
        }
    } else {
        dia_semana = dia_semana_input.toUpperCase();
    }

    const nuevoHorario = {
        id_aula: Number(id_aula),
        dia_semana,
        hora_inicio,
        hora_fin,
        minutos_equivalentes
    };

    try {
        const response = await fetch(`${API_URL}/horarios`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(nuevoHorario)
        });

        const data = await response.json();

        if (response.ok) {
            alert(
                "Horario creado correctamente.\n\n" +
                "ID generado: " + (data.id_horario ?? "N/D") + "\n" +
                "Aula: " + id_aula + "\n" +
                "Día: " + dia_semana + "\n" +
                "Inicio: " + hora_inicio + "\n" +
                "Fin: " + hora_fin + "\n" +
                "Minutos equivalentes: " + minutos_equivalentes
            );

            document.getElementById("N_Aula").value = "";
            document.getElementById("Hora_Inicio").value = "";
            document.getElementById("Hora_Fin").value = "";
            document.getElementById("Minutos").value = "";
            document.getElementById("Dia_Semana").value = "";
        } else {
            alert("Error: " + (data.error || data.message || "No se pudo crear el horario"));
        }

    } catch (error) {
        console.error("Error:", error);
        alert("Error de conexión con el servidor");
    }
});
</script>

</body>
</html>
